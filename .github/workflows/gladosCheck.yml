name: Browser check-in trial

on: workflow_dispatch

permissions:
  contents: read

jobs:
  browser-trial:
    if: github.ref == 'refs/heads/browser-checkin-trial-20261115' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install playwright==1.65.2
      - name: Check the official browser flow once
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_TRIAL_DAY: '2026-11-15'
        run: python browser_checkin_trial.py
